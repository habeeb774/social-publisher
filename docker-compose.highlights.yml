name: movie-highlights
services:
  vision:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports: ["127.0.0.1:11434:11434"]
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes: [vision-models:/root/.ollama]
    mem_limit: 8g
volumes:
  vision-models: {}
