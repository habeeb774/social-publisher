# Local dev stack for movie reels (provider-agnostic). Usage:
#   docker compose -f docker-compose.movies.yml up -d minio minio-init
#   docker compose -f docker-compose.movies.yml --profile worker up -d --build
#   docker compose -f docker-compose.movies.yml --profile postgres up -d   # optional local PG
# The Next.js app runs on the host (npm run dev, port 3000). Dev-only credentials below.
name: movie-reels-dev
services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio-dev
      MINIO_ROOT_PASSWORD: minio-dev-password-change-me
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:3000
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio-data:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 20

  # Creates the private bucket. MinIO applies CORS server-wide (MINIO_API_CORS_ALLOW_ORIGIN
  # above; PUT allowed, ETag exposed). On R2/S3 use the bucket CORS JSON in docs/movie-reels-local-dev.md.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on: { minio: { condition: service_healthy } }
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minio-dev minio-dev-password-change-me &&
      mc mb --ignore-existing local/movie-reels &&
      mc anonymous set none local/movie-reels &&
      echo bucket ready"
    restart: "no"

  worker:
    profiles: [worker]
    build: { context: ., dockerfile: workers/movie-reels/Dockerfile }
    environment:
      MOVIE_API_URL: http://host.docker.internal:3000
      MOVIE_ALLOW_INSECURE_API: "1"   # dev only: http to host app
      MOVIE_WORKER_SECRET: ${MOVIE_WORKER_SECRET:?set MOVIE_WORKER_SECRET (>=32 chars) in your shell or .env}
      MOVIE_POLL_SECONDS: "5"
      MOVIE_WHISPER_MODEL_DIR: ${MOVIE_WHISPER_MODEL_DIR_IN_CONTAINER:-}
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - reels-work:/work
      - ./workers/movie-reels/models:/models:ro
    mem_limit: 4g

  postgres:
    profiles: [postgres]
    image: postgres:16.4-alpine
    environment: { POSTGRES_USER: movies, POSTGRES_PASSWORD: movies-dev, POSTGRES_DB: social_publisher }
    ports: ["5433:5432"]
    volumes: [pg-data:/var/lib/postgresql/data]

volumes: { minio-data: {}, reels-work: {}, pg-data: {} }
